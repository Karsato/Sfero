services:
  node1:
    build: .
    container_name: sfero_node1
    command: ["8080", "node2:8080", "node3:8080"]
    stdin_open: true 
    tty: true
    ports:
      - "8081:8080"
    volumes:
      - .:/app
    networks:
      sfero_net:

  node2:
    build: .
    container_name: sfero_node2
    command: ["8080", "node1:8080", "node3:8080"]
    stdin_open: true 
    tty: true
    ports:
      - "8082:8080"
    volumes:
      - .:/app
    networks:
      sfero_net:

  node3:
    build: .
    container_name: sfero_node3
    command: ["8080", "node1:8080", "node2:8080"]
    stdin_open: true 
    tty: true
    ports:
      - "8083:8080"
    volumes:
      - .:/app
    networks:
      sfero_net:

networks:
  sfero_net:
    driver: bridge

volumes:
  node1_data:
  node2_data:
  node3_data:
